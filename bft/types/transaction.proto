syntax = "proto3";

enum TransactionType {
  NormalTransaction = 0;
  VerificationTransaction = 1;
  ResourceTransaction = 2;
  NodeRegistrationTransaction = 3;
  SummaryTransaction = 4;
  PolygonCheckpointTransaction = 5;
}
message PolygonCheckpointTransactionData {
  uint64 blockno = 1;
  string blockhash = 2;
}

message VerificationTransactionData {
  string attestation = 1;
  string cid = 2;
  string datasource = 3;
  int64 timestamp = 4;
}

message ResourceTransactionData {
  double totalResources = 1;
  double rewardedResources = 2;
}

message NormalTransactionData {
  double transactionAmount = 1;
  string sentTo = 2;
}

// Node Registration Transaction Data
// nodeSignature is the signature of lastblockhash signed with the publickey of the node 
// nodeAddress here refers to the publickey of the node and not the address
// their can be a case of someone repeating a transaction on multiple blocks but this doesn't affect because they won't be able to join as validators
// nodeSignature is needed as we don't want people to spam the network on behalf of someone else
message NodeRegistrationTransactionData {
  string nodeAddress = 1;
  string nodeAttestation = 2;
  string nodeSignature = 3;  
  string tokenID = 4;
}
message SummaryTransactionData {
  string hash = 1;
  int64 numTx = 2;
}
message Transaction {
  string owner = 1;
  string signature = 2;
  TransactionType type = 3;
  oneof data {
    VerificationTransactionData verificationData = 4; 
    ResourceTransactionData resourceData = 5; 
    NormalTransactionData normalData = 6; 
    NodeRegistrationTransactionData nodeRegistrationData = 7; 
    SummaryTransactionData SummaryTransactionData = 8;
    PolygonCheckpointTransactionData  PolygonCheckpointTransactionData = 9;
  }
}
